[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_tools"
version = "0.1.0"
description = "Unified utilities for the AI ecosystem"
authors = [{ name = "Andrew" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml"
]

[project.urls]
Homepage = "https://github.com/SlyChung/ai_tools"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_tools*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "stub: marks tests for stub/skeleton implementations (not yet implemented)",
    "mvp: marks tests for MVP components (partially implemented)",
    "production: marks tests for production-ready components",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/ai_tools"]
omit = [
    "*/deprecated/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "pass",
]
