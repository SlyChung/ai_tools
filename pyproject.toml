[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tools"
version = "0.1.0"
description = "Unified utilities for the AI ecosystem"
authors = [{name = "Andrew"}]
readme = "README.md"
license = {text = ""}
requires-python = "3.10"
dependencies = [
    
]

[project.urls]
Homepage = "https://github.com/yourusername/eliot_tools"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# Ensure both packages are discovered
include = ["ai_tools*", "utilities*"]
namespaces = false